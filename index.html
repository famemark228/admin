<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления сайтом</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        #messages, #bannedUsers, #photos {
            border: 1px solid #ccc;
            padding: 10px;
            background: white;
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 10px;
        }
        button {
            padding: 10px;
            margin: 5px;
        }
        #loginForm {
            display: none;
        }
        .dark-theme {
            background-color: #333;
            color: white;
        }
        .dark-theme #messages, .dark-theme #bannedUsers, .dark-theme #photos {
            background: #444;
            border-color: #666;
        }
    </style>
</head>
<body>
    <div id="loginForm">
        <h2>Вход в панель управления</h2>
        <input type="password" id="password" placeholder="Введите пароль" />
        <button id="loginButton">Войти</button>
        <p id="loginError" style="color: red; display: none;">Неверный пароль!</p>
    </div>

    <div id="adminPanel" style="display: none;">
        <h1>Панель управления сайтом</h1>

        <h2>Отправить сообщение от имени администратора</h2>
        <input type="text" id="adminMessage" placeholder="Введите сообщение от админа" />
        <input type="text" id="adminUser" placeholder="Введите ник пользователя" />
        <button id="sendAdmin">Отправить</button>
        
        <h2>Забанить пользователя по нику</h2>
        <input type="text" id="banUser" placeholder="Введите ник для бана" />
        <button id="ban">Забанить</button>

        <h2>Загрузить фото</h2>
        <input type="file" id="photoUpload" accept="image/*" />
        <button id="uploadPhoto">Загрузить фото</button>
        
        <h2>Удалить все сообщения</h2>
        <button id="deleteMessages">Удалить все сообщения</button>

        <h2>Удалить все фотографии</h2>
        <button id="deletePhotos">Удалить все фотографии</button>

        <h2>Сообщения</h2>
        <div id="messages"></div>
        <button id="reset">Сбросить все сообщения</button>

        <h2>Забаненные пользователи</h2>
        <div id="bannedUsers"></div>

        <h2>Загруженные фотографии</h2>
        <div id="photos"></div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const bannedUsersDiv = document.getElementById('bannedUsers');
        const photosDiv = document.getElementById('photos');
        const resetButton = document.getElementById('reset');
        const sendAdminButton = document.getElementById('sendAdmin');
        const adminMessageInput = document.getElementById('adminMessage');
        const adminUserInput = document.getElementById('adminUser');
        const banUserInput = document.getElementById('banUser');
        const loginForm = document.getElementById('loginForm');
        const adminPanel = document.getElementById('adminPanel');
        const loginButton = document.getElementById('loginButton');
        const passwordInput = document.getElementById('password');
        const loginError = document.getElementById('loginError');
        const photoUpload = document.getElementById('photoUpload');
        const uploadPhotoButton = document.getElementById('uploadPhoto');
        const deleteMessagesButton = document.getElementById('deleteMessages');
        const deletePhotosButton = document.getElementById('deletePhotos');

        // Проверка пароля
        const checkPassword = () => {
            const password = passwordInput.value;
            if (password === 'admin') {
                loginForm.style.display = 'none';
                adminPanel.style.display = 'block';
                loadMessages();
                loadBannedUsers();
                loadPhotos();
            } else {
                loginError.style.display = 'block';
            }
        };

        const loadMessages = () => {
            const messages = JSON.parse(localStorage.getItem('messages')) || [];
            messagesDiv.innerHTML = '';
            messages.forEach((msg) => {
                const msgElement = document.createElement('div');
                msgElement.textContent = `Пользователь ${msg.number}: ${msg.text}`;
                messagesDiv.appendChild(msgElement);
            });
        };

        const loadBannedUsers = () => {
            const bannedUsers = JSON.parse(localStorage.getItem('bannedUsers')) || [];
            bannedUsersDiv.innerHTML = '';
            bannedUsers.forEach(user => {
                const userElement = document.createElement('div');
                userElement.textContent = `Забаненный пользователь: ${user}`;
                bannedUsersDiv.appendChild(userElement);
            });
        };

        const loadPhotos = () => {
            const photos = JSON.parse(localStorage.getItem('photos')) || [];
            photosDiv.innerHTML = '<h3>Загруженные фотографии:</h3>';
            photos.forEach(photo => {
                const imgElement = document.createElement('img');
                imgElement.src = photo;
                imgElement.style.width = '100px';
                imgElement.style.margin = '5px';
                photosDiv.appendChild(imgElement);
            });
        };

        const sendAdminMessage = () => {
            const message = adminMessageInput.value;
            const userNumber = adminUserInput.value;

            if (message && userNumber) {
                const messages = JSON.parse(localStorage.getItem('messages')) || [];
                messages.push({ number: 'Админ', text: message });
                localStorage.setItem('messages', JSON.stringify(messages));
                adminMessageInput.value = '';
                loadMessages();
            } else {
                alert('Пожалуйста, введите сообщение и ник пользователя.');
            }
        };

        const deleteMessages = () => {
            localStorage.removeItem('messages');
            loadMessages();
            alert('Все сообщения были удалены.');
        };

        const deletePhotos = () => {
            localStorage.removeItem('photos');
            loadPhotos();
            alert('Все фотографии были удалены.');
        };

        resetButton.addEventListener('click', () => {
            localStorage.removeItem('messages');
            loadMessages();
        });

        loginButton.addEventListener('click', checkPassword);
        sendAdminButton.addEventListener('click', sendAdminMessage);
        deleteMessagesButton.addEventListener('click', deleteMessages);
        deletePhotosButton.addEventListener('click', deletePhotos);
        
        // Забанить пользователя по нику
        document.getElementById('ban').addEventListener('click', () => {
            const userNick = banUserInput.value;
            if (userNick) {
                const bannedUsers = JSON.parse(localStorage.getItem('bannedUsers')) || [];
                if (!bannedUsers.includes(userNick)) {
                    bannedUsers.push(userNick);
                    localStorage.setItem('bannedUsers', JSON.stringify(bannedUsers));
                    loadBannedUsers();
                    banUserInput.value = '';
                } else {
                    alert('Пользователь уже забанен.');
                }
            } else {
                alert('Пожалуйста, введите ник для бана.');
            }
        });

        loginForm.style.display = 'block'; // Показываем форму входа
    </script>
</body>
</html>
